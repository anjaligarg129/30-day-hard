<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>30 Day Hard</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Urbanist:wght@600;700;800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: phone-first dashboard. Time-of-day sky scene with both characters, versus strip, controls, day strip, then avatar-beside-checklist rows. */
:root{
  --bg:#FFFAF4; --card:#F8F0E8; --ink:#2A2124; --muted:#8B7F80; --line:#EFE4DA; --track:#F0E6DD;
  --pink:#E0457B; --pink-soft:#FCDDE7; --blue:#5AAEE0; --blue-soft:#DCEFFA; --lav-soft:#EEE8FB;
  --lime:#D5F16B; --lime-soft:#F1F8D3; --peach-soft:#FDDCCB; --peach:#E9875E; --sky:#DCEFFA; --butter:#FDF0C2; --on-acc:#2A2124;
  --display:"Urbanist", "Avenir Next", system-ui, sans-serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
:root[data-theme="dark"]{--bg:#16131A; --card:#221D25; --ink:#F6EFEA; --muted:#AA9FA6; --line:#342C37; --track:#2F2832;
  --pink-soft:#4B2132; --blue-soft:#1C3443; --lav-soft:#2C2645; --lime-soft:#2D3417; --sky:#1C3443; --butter:#3B331C; --peach-soft:#4A2B20; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
.wrap{max-width:1000px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 56px;display:grid;gap:14px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:-.01em;text-wrap:balance}
.card{background:var(--card);border-radius:26px;padding:16px;min-width:0}
.muted{color:var(--muted)}
.tab{font-variant-numeric:tabular-nums}

/* top */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.hello{display:flex;align-items:center;gap:10px;min-width:0}
.head{width:46px;height:46px;border-radius:50%;flex:0 0 auto;overflow:hidden;display:block}
.head svg{width:100%;height:100%;display:block}
.hello small{display:block;color:var(--muted);font-weight:600;font-size:13px}
.hello b{font-family:var(--display);font-weight:800;font-size:20px;line-height:1.1}
.round{width:44px;height:44px;border-radius:50%;border:0;background:var(--card);display:grid;place-items:center;flex:0 0 auto}
.round svg{width:20px;height:20px}

/* hero */
.scene{position:relative;border-radius:28px;overflow:hidden;height:168px;isolation:isolate}
.sky{position:absolute;inset:0;z-index:-2}
.scene .txt{position:absolute;left:18px;top:16px;right:110px;z-index:3;color:var(--st)}
.scene h2{font-size:clamp(26px,7vw,34px);font-weight:800;line-height:1.02}
.scene .sub2{font-weight:600;font-size:13px;opacity:.85;margin:4px 0 8px}
.wx{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700;background:rgba(255,255,255,.55);color:#2A2124;backdrop-filter:blur(4px)}
.scene .mring{position:absolute;right:16px;top:16px;width:78px;height:78px;z-index:3}
.scene .mring span{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:17px;color:var(--st)}
.orb{position:absolute;border-radius:50%;z-index:-1}
.cloud{position:absolute;z-index:-1;animation:drift linear infinite}
@keyframes drift{from{transform:translateX(-160px)}to{transform:translateX(calc(100vw + 40px))}}
.starf{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;z-index:-1;animation:tw 2.6s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1.3)}}
.drop{position:absolute;top:-20px;width:2px;height:14px;border-radius:2px;background:rgba(255,255,255,.7);z-index:-1;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(340px)}}
.hill{position:absolute;left:-5%;right:-5%;bottom:-40px;height:110px;border-radius:50%;z-index:0}
.hero{border-radius:28px;padding:20px;display:flex;align-items:center;justify-content:space-between;gap:16px;color:#fff;background:var(--pink)}
.hero h2{font-size:clamp(28px,7vw,38px);font-weight:800;line-height:1.02}
.hero p{margin:6px 0 12px;font-weight:600;opacity:.92}
.hero .ring{flex:0 0 auto;width:104px;height:104px;position:relative}
.hero .ring svg{width:100%;height:100%}
.hero .ring span{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:24px}
.walkcard{padding:0;overflow:hidden}
.walkcard .wh{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:14px 16px 10px}
.walkcard .wh h3{font-size:20px;font-weight:800}
.berk{position:relative;height:330px;overflow:hidden;isolation:isolate}
.berk .wx{position:absolute;left:14px;top:12px;z-index:6}
.berk .walker .tag{background:rgba(255,246,234,.9)}
.world{position:absolute;inset:0;overflow-x:auto;overflow-y:hidden;z-index:2;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.world::-webkit-scrollbar{display:none}
.wstrip{position:relative;height:100%}
.ground{position:absolute;left:0;right:0;bottom:0;height:64px}
.pathline{position:absolute;left:0;right:0;top:34px;border-top:3px dashed;opacity:.55}
.berk .bd{position:absolute;left:0;bottom:0;z-index:0;will-change:transform}
.lm{position:absolute;bottom:60px;transform:translateX(-50%)}
.lm svg{display:block}

.walker{position:absolute;transform:translateX(-50%);transition:left .9s cubic-bezier(.3,1.2,.5,1)}
.walker.front{bottom:4px;width:96px;z-index:4}.walker.back{bottom:28px;width:80px;z-index:3}
.walker .say{width:100%}
.walker .tag{bottom:-4px}
.wfoot{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 16px 16px;font-weight:600}
.jump{border:1.5px solid var(--line);background:var(--bg);border-radius:999px;padding:5px 10px;font-weight:700;font-size:13px;font-variant-numeric:tabular-nums}
.jump i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:0}
.race h3{font-size:20px;font-weight:800}
.racehead{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.lanes{display:grid;gap:22px;margin:14px 0 10px;padding-right:26px;position:relative}
.lw{display:grid;gap:22px}
.lt{display:flex;align-items:baseline;gap:6px;font-weight:700;font-size:13px}
.lt b{font-family:var(--display);font-size:18px;color:var(--rc);font-variant-numeric:tabular-nums}
.lt .rkp{margin-left:auto;font-size:11px;font-weight:800;border-radius:999px;padding:1px 8px;background:var(--rc);color:#fff}
.rl{position:relative;height:12px;border-radius:999px;background:var(--track)}
.rl .fill{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:var(--rc);transition:width .8s ease}
.mk{position:absolute;top:50%;transform:translate(-50%,-50%);width:44px;transition:left .8s ease}
.mk .say{width:44px;height:44px;border-radius:50%;overflow:visible;box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--rc)}
.mk .say .head{width:44px;height:44px}
.mk .bub{bottom:calc(100% + 10px)}
.rk{position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);white-space:nowrap;font-size:11px;font-weight:800;background:var(--bg);border:1.5px solid var(--line);border-radius:999px;padding:1px 7px;font-variant-numeric:tabular-nums}
.rk b{color:var(--rc)}
.fin{position:absolute;right:0;top:30px;bottom:-14px;width:4px;border-radius:2px;background:repeating-linear-gradient(0deg,var(--ink) 0 5px,transparent 5px 10px)}
.ticks{display:flex;justify-content:space-between;font-size:11px;font-weight:700;color:var(--muted);padding-right:26px;font-variant-numeric:tabular-nums}
.racefoot{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:12px;font-weight:600}
.track{position:absolute;left:0;right:0;bottom:0;height:230px;z-index:2}
.lane{position:absolute;left:0;right:0}
.lane.back{bottom:74px}.lane.front{bottom:2px}
.runner{position:absolute;bottom:0;transform:translateX(-50%);transition:left .9s cubic-bezier(.3,1.2,.5,1)}
.lane.back .runner{width:min(20vw,86px)}.lane.front .runner{width:min(24vw,104px)}
.runner .say{width:100%}
.walk svg{animation:walk .9s ease-in-out infinite;transform-origin:bottom center}
@keyframes walk{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-4px) rotate(1.5deg)}}
.tag{position:absolute;left:50%;bottom:-2px;transform:translateX(-50%);white-space:nowrap;background:rgba(255,255,255,.85);color:#2A2124;border-radius:999px;padding:2px 8px;font-size:11px;font-weight:800;font-variant-numeric:tabular-nums;pointer-events:none}
.crown{position:absolute;left:50%;top:-16px;z-index:2;transform:translateX(-50%);font-size:18px;pointer-events:none}
.path{position:absolute;left:4%;right:6%;height:0;border-top:3px dashed rgba(255,255,255,.75)}
.flag{position:absolute;right:4%;bottom:6px;width:30px;z-index:1}
.logsteps{border:0;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:800;background:var(--pink);color:#fff;margin-left:6px}
@media (prefers-reduced-motion:reduce){.walk svg{animation:none}}
.duo2{position:absolute;left:0;right:0;bottom:4px;display:flex;justify-content:center;gap:clamp(8px,6vw,60px);z-index:4}
.say{position:relative;border:0;background:none;padding:0;width:min(28vw,124px)}
.say svg{width:100%;height:auto;display:block}
.bub{position:absolute;left:50%;bottom:calc(100% - 22px);transform:translateX(-50%) scale(.6);opacity:0;pointer-events:none;background:#fff;color:#2A2124;border-radius:16px;padding:8px 12px;font-weight:600;font-size:13px;line-height:1.3;width:max-content;max-width:min(200px,46vw);box-shadow:0 6px 18px rgba(42,33,36,.14);transition:transform .25s cubic-bezier(.3,1.6,.5,1),opacity .2s;z-index:5;text-align:left}
.bub::after{content:"";position:absolute;left:50%;bottom:-7px;margin-left:-7px;border:7px solid transparent;border-bottom:0;border-top-color:#fff}
.bub.on{opacity:1;transform:translateX(-50%) scale(1)}
.hop{animation:hop .45s ease-out}
@keyframes hop{30%{transform:translateY(-14px)}60%{transform:translateY(0)}80%{transform:translateY(-4px)}}
@media (prefers-reduced-motion:reduce){.cloud,.starf,.drop,.hop{animation:none}}
.fig{position:relative}
.fig .say{width:100%}

.pill{display:inline-flex;align-items:center;gap:6px;background:var(--lime);color:var(--on-acc);border-radius:999px;padding:6px 12px;font-weight:700;font-size:13px}
/* versus */
.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.side{display:flex;align-items:center;gap:10px;min-width:0}
.side.r{flex-direction:row-reverse;text-align:right}
.side .head{width:52px;height:52px}
.side b{display:block;font-family:var(--display);font-size:22px;font-weight:800;line-height:1}
.side small{color:var(--muted);font-weight:600;font-size:12px}
.vtag{font-family:var(--display);font-weight:800;color:var(--muted);font-size:14px}
.lead{margin-top:12px;display:flex;justify-content:center}

/* controls */
.ctrls{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--card);border-radius:999px;padding:4px;gap:2px}
.seg button{border:0;background:none;border-radius:999px;padding:8px 14px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

/* strip */
.striphead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.striphead h3{font-size:18px;font-weight:800}
.arrows{display:flex;gap:6px}
.arrows button{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--line);background:none;font-weight:800;font-size:16px}
.arrows button:disabled{opacity:.35;cursor:default}
.strip{display:flex;gap:4px;overflow-x:auto;padding-top:10px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;width:46px;border:0;background:none;display:grid;justify-items:center;gap:4px;padding:4px 0}
.chip .wd{font-size:12px;font-weight:700;color:var(--muted)}
.chip .n{width:38px;height:52px;border-radius:999px;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:15px;border:1.5px solid transparent}
.chip.today .n{border-color:var(--pc)}
.chip[aria-current="true"] .n{background:var(--pc);color:#fff}
.chip.future .n{color:var(--muted)}
.dots{display:flex;gap:3px;height:6px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--track)}

/* day */
.people{display:grid;grid-template-columns:repeat(var(--cols,1),minmax(0,1fr));gap:14px}
@media (max-width:760px){.people{--cols:1 !important}}
.person{display:grid;grid-template-columns:150px minmax(0,1fr);gap:14px;align-items:center}
@media (max-width:420px){.person{grid-template-columns:104px minmax(0,1fr);gap:10px}}
.fig svg{width:100%;height:auto;display:block}
.ptitle{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.ptitle h3{font-size:22px;font-weight:800}
.ptitle span{font-weight:700;color:var(--muted);font-size:13px}
.list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.task{width:100%;display:flex;align-items:center;gap:10px;background:var(--bg);border:1.5px solid var(--line);border-radius:18px;padding:10px 12px;text-align:left;font-weight:600}
.task .ic{flex:0 0 auto;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--tint)}
.task .ic svg{width:15px;height:15px;opacity:0}
.task .lbl{flex:1;min-width:0;overflow-wrap:anywhere}
.task .pts{font-size:12px;font-weight:700;color:var(--muted)}
.task.done{background:var(--ps);border-color:transparent}
.task.done .ic{background:var(--pc)}
.task.done .ic svg{opacity:1}
.task.done .lbl{text-decoration:line-through;text-decoration-color:var(--pc);text-decoration-thickness:2px}
.task.ro{cursor:default}
.rr select{flex:0 0 auto;font:inherit;font-size:13px;font-weight:700;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:14px;padding:0 8px}
.sec{overflow-wrap:anywhere;font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:6px}
.wkc{font-size:12px;font-weight:800;color:var(--muted);white-space:nowrap}
.wkc.met{color:var(--pc)}
.wgoals{display:grid;gap:8px;margin-top:14px;padding-top:12px;border-top:1.5px solid var(--line)}
.wg{display:flex;align-items:center;gap:10px;font-weight:600}
.wg span:first-child{flex:1;min-width:0}
.dotsw{display:flex;gap:4px}.dotsw i{width:12px;height:12px;border-radius:50%;background:var(--track)}.dotsw i.on{background:var(--pc)}
.petbob{animation:petb 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom center}
@keyframes petb{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
.coinpill{white-space:nowrap;display:inline-flex;align-items:center;gap:6px;border:0;border-radius:999px;padding:0 12px 0 8px;height:44px;background:var(--butter);color:var(--on-acc);font-weight:800;font-variant-numeric:tabular-nums}
.coinpill svg{width:20px;height:20px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);opacity:0;background:var(--ink);color:var(--bg);border-radius:999px;padding:10px 16px;font-weight:800;z-index:30;transition:all .25s;pointer-events:none;display:flex;gap:6px;align-items:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.toast svg{width:18px;height:18px}
.shophead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.shophead h2{font-size:30px;font-weight:800}
.backbtn{border:0;background:var(--card);border-radius:999px;height:44px;padding:0 16px;font-weight:800}
.stage{display:grid;grid-template-columns:150px minmax(0,1fr);gap:14px;align-items:center;background:linear-gradient(180deg,var(--pink-soft),var(--card));border-radius:28px;padding:14px 16px}
.stage .fig svg{width:100%;height:auto;display:block}
.stage h3{font-size:20px;font-weight:800}
.stage p{margin:4px 0 10px;color:var(--muted);font-weight:600;font-size:13px}
.cats{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.cats::-webkit-scrollbar{display:none}
.cats button{flex:0 0 auto;border:0;border-radius:999px;padding:9px 14px;font-weight:700;background:var(--card);color:var(--muted)}
.cats button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.item{background:var(--card);border-radius:22px;padding:10px;display:grid;gap:6px;min-width:0;border:2px solid transparent}
.item.trying{border-color:var(--pink)}
.item .thumb{border:0;background:var(--bg);border-radius:16px;padding:6px;aspect-ratio:1;display:grid;place-items:center;width:100%}
.item .thumb svg{width:100%;height:100%}
.item b{font-size:14px;line-height:1.2}
.item small{color:var(--muted);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.buy{border:0;border-radius:999px;padding:8px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:5px;background:var(--pink);color:#fff}
.buy svg{width:16px;height:16px}
.buy.own{background:var(--bg);color:var(--ink);border:1.5px solid var(--line)}
.buy.on{background:var(--lime);color:var(--on-acc)}
.buy:disabled{background:var(--track);color:var(--muted);cursor:default}
.stepper{display:flex;align-items:center;gap:6px;flex:0 0 auto}
.stepper button{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--line);background:var(--bg);font-weight:800;font-size:16px}
.amtv{font-weight:800;font-size:13px;min-width:38px;text-align:center;font-variant-numeric:tabular-nums}
.amtrow{flex-wrap:wrap;row-gap:8px}.amtrow .lbl{flex:1 1 90px}.amtrow.done .lbl{text-decoration:none}.amtrow .stepper{margin-left:auto}.stepper button{width:30px;height:30px}
.amtrow .lbl small{font-size:11px}
.amtcfg{align-items:center;font-size:13px;font-weight:700;color:var(--muted);margin-top:-2px}
.amtcfg input{width:auto;flex:1;padding:8px 10px}
.mbar{width:90px;height:8px;border-radius:999px;background:var(--track);overflow:hidden}.mbar i{display:block;height:100%;background:var(--pc);border-radius:999px}
.item{position:relative}
.newtag{position:absolute;top:14px;left:14px;z-index:2;background:var(--pink);color:#fff;font-size:10px;font-weight:800;letter-spacing:.08em;border-radius:999px;padding:3px 8px}
.item.locked .thumb{display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:40px;color:var(--muted);background:repeating-linear-gradient(135deg,var(--track) 0 6px,transparent 6px 12px)}
.dropbar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;background:var(--butter);color:var(--on-acc);border-radius:18px;padding:10px 14px;font-size:13px;font-weight:600}
.dropban{display:flex;align-items:center;justify-content:space-between;gap:10px;border:0;border-radius:22px;padding:14px 16px;background:var(--butter);color:var(--on-acc);text-align:left;font-weight:600}
.dropban .go{font-weight:800;white-space:nowrap}
.ic.lim{font-family:var(--display);font-weight:800;font-size:14px;color:var(--on-acc)}
.limrow{flex-wrap:wrap;row-gap:4px}.limrow .lbl{flex:1 1 100px}.limrow .pts{margin-left:auto}.limrow.used .lbl{text-decoration:none}
.limrow.used{background:var(--peach-soft);border-color:transparent}.limrow.used .ic.lim{background:var(--peach);color:#fff}
.overl{color:#C2402E!important}
.note{font-size:13px;font-weight:600;color:var(--muted);margin-top:10px}
.perfect{background:var(--lime);color:var(--on-acc);border-radius:999px;padding:2px 10px;font-size:12px;font-weight:800;font-family:var(--body)}
.bounce{animation:bounce .8s ease-in-out infinite alternate}
@keyframes bounce{from{transform:translateY(0)}to{transform:translateY(-7px)}}
@media (prefers-reduced-motion:reduce){.bounce{animation:none}}

/* week */
.wkhead{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.wkhead h3{font-size:20px;font-weight:800}
.bars{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;align-items:end}
.bars button{border:0;background:none;display:grid;justify-items:center;gap:6px;padding:0}
.bars .pct{font-size:12px;font-weight:700;color:var(--muted)}
.bars .col{width:100%;max-width:34px;height:130px;border-radius:999px;position:relative;overflow:hidden;background:repeating-linear-gradient(135deg,var(--track) 0 4px,transparent 4px 8px);border:1.5px solid var(--line)}
.bars .fill{position:absolute;left:0;right:0;bottom:0;border-radius:999px;background:var(--ps)}
.bars button[aria-current="true"] .fill{background:var(--pc)}
.bars .d{font-size:12px;font-weight:700}

/* month */
.legend{display:flex;gap:14px;flex-wrap:wrap;font-weight:700;font-size:13px;margin-bottom:10px}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:50%}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px 4px}
.cal .h{text-align:center;font-size:12px;font-weight:700;color:var(--muted)}
.cal button{border:0;background:none;padding:2px;display:grid;place-items:center}
.cal svg{width:100%;max-width:60px;height:auto}

/* onboarding */
.ob{max-width:520px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 40px;display:grid;gap:16px}
.welcome{background:var(--pink);color:#fff;border-radius:32px;padding:24px 20px 20px;display:grid;gap:8px;overflow:hidden}
.welcome .duo{display:flex;justify-content:center;align-items:flex-end;gap:0;margin:4px 0 -6px}
.welcome .duo svg{width:48%;max-width:190px;height:auto}
.welcome h1{font-size:clamp(34px,9vw,46px);font-weight:800;line-height:1}
.welcome p{margin:0;font-weight:600;opacity:.92}
.big{width:100%;border:0;border-radius:999px;padding:16px;font-weight:800;font-size:16px;font-family:var(--display)}
.big.dark{background:var(--ink);color:var(--bg)}
.big.lime{background:var(--lime);color:var(--on-acc)}
.steps{display:flex;gap:6px;justify-content:center}
.steps i{width:8px;height:8px;border-radius:999px;background:var(--track)}
.steps i.on{width:24px;background:var(--pink)}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pick button{border:2px solid transparent;background:var(--card);border-radius:26px;padding:14px 10px 12px;display:grid;justify-items:center;gap:6px}
.pick button svg{width:100%;max-width:140px;height:auto}
.pick button b{font-family:var(--display);font-size:22px;font-weight:800}
.pick button:hover{border-color:var(--line)}
.ob h2{font-size:28px;font-weight:800}
.field{display:grid;gap:6px;font-weight:700;font-size:13px;color:var(--muted)}
input[type=text],input[type=date]{font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:14px;padding:11px 12px;width:100%;box-sizing:border-box;min-width:0}
.rules{display:grid;gap:8px}
.rr{display:flex;gap:8px}
.rr button{flex:0 0 auto;width:44px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);font-weight:800;font-size:18px}
.sugg{display:flex;flex-wrap:wrap;gap:6px}
.sugg button{border:0;border-radius:999px;padding:7px 12px;font-weight:600;font-size:13px;background:var(--tint,var(--sky));color:var(--ink)}

/* sheet */
.sheet{position:fixed;inset:0;z-index:20;background:rgba(18,17,24,.45);display:grid;place-items:end center;padding-top:env(safe-area-inset-top,0px)}
.panel{background:var(--bg);width:min(560px,100%);max-height:92%;overflow:auto;border-radius:28px 28px 0 0;display:grid;gap:14px;padding-block:20px calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.row2{display:flex;gap:8px;flex-wrap:wrap}
.row2 button{flex:1;border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:12px;font-weight:700}
.status{font-size:13px;font-weight:600;color:var(--muted);text-align:center}
.empty{padding:16px;border-radius:18px;background:var(--track);font-weight:600;color:var(--muted)}

    for(let i=a;i<=a+6;i++){if(i>30){cols+="<span></span>";continue}const f=frac(k,i),d=parse(dateOf(i));done+=doneFor(k,i).length;tot+=1;

    return `<section class="card" style="--pc:${P.pc};--ps:${P.ps}"><div class="wkhead">${head(k,frac(k,clampDay(S.sel)))}<div><h3>${k===S.me?"You":P.name}</h3><div class="muted" style="font-weight:600;font-size:13px">Week ${w+1} · days ${a}–${b} · ${done} checks</div></div></div><div class="bars">${cols}</div>${weeklyRules(k).length?`<div class="wgoals">${weeklyRules(k).map(r=>{const c=weekVal(k,r,w),tg=weekTarget(r,w);return `<div class="wg"><span>${esc(r.label)}</span>${isAmt(r)?`<span class="mbar"><i style="width:${Math.min(c/tg,1)*100}%"></i></span>`:`<span class="dotsw">${Array.from({length:tg},(_,q)=>`<i class="${q<c?"on":""}"></i>`).join("")}</span>`}<b class="tab">${c}/${tg}${isAmt(r)?" "+esc(r.unit||""):""}</b></div>`}).join("")}</div>`:""}</section>`}).join("")+`</div>`;
}
function viewMonth(){
  const list=whoList(),off=parse(start()).getDay();
  let g=["S","M","T","W","T","F","S"].map(x=>`<div class="h">${x}</div>`).join("");
  for(let k=0;k<off;k++)g+="<span></span>";
  for(let i=1;i<=30;i++){
    const o=ring(frac(list[0],i),PEOPLE[list[0]].hex,60,6);
    const inn=list[1]?`<g transform="translate(10 10)">${ring(frac(list[1],i),PEOPLE[list[1]].hex,40,6)}</g>`:"";
    const sel=i===S.sel?`<circle cx="30" cy="30" r="${list[1]?13:21}" fill="var(--lime)"/>`:"";
    g+=`<button data-go="${i}" aria-label="Day ${i}, ${label(i)}"><svg viewBox="0 0 60 60">${o}${inn}${sel}<text x="30" y="35" text-anchor="middle" font-family="Urbanist, sans-serif" font-weight="800" font-size="14" fill="${i===S.sel?"#1D1B2A":"var(--ink)"}">${parse(dateOf(i)).getDate()}</text></svg></button>`}
  return `<section class="card"><div class="legend">${list.map((k,j)=>`<span><i style="background:${PEOPLE[k].hex}"></i>${k===S.me?"You":PEOPLE[k].name}${list.length>1?(j?" · inner ring":" · outer ring"):""}</span>`).join("")}</div>
    <div class="cal">${g}</div><div class="note">Tap any day to open it.</div></section>`;
}

/* shop */
const CATS=[["top","Tops"],["bottom","Bottoms"],["dress","Dresses"],["shoes","Shoes"],["acc","Accessories"],["pet","Pets"]];
const ACC=["hat","face","neck","ears","hair","bag"];
const CROP={top:"44 74 72 84",bottom:"40 140 80 104",dress:"36 82 88 146",shoes:"50 196 60 52",hat:"46 4 68 66",face:"52 30 56 40",hair:"50 4 66 62",ears:"48 34 64 46",neck:"56 70 48 40",bag:"30 80 96 90",pet:"114 192 48 58"};
function equip(W,id){const x=ITEM[id],n={...W};n[x.slot]=id;if(x.slot==="dress"){delete n.top;delete n.bottom}if(x.slot==="top"||x.slot==="bottom")delete n.dress;return n}
function shopHTML(){
  const me=S.me,cl=S.closet[me],c=coins(me),W=S.tryOn||cl.wear;
  const live=dropLive(),nd=nextDropDay(),ti=todayIdx();
  const list=ITEMS.filter(x=>(x.drop<=live||cl.owned.includes(x.id))&&(S.cat==="acc"?ACC.includes(x.slot):x.slot===S.cat)).sort((a,b)=>b.drop-a.drop);
  const teaseN=nd?DROPS[live+1].ids.filter(id=>ITEM[id]&&(S.cat==="acc"?ACC.includes(ITEM[id].slot):ITEM[id].slot===S.cat)).length:0;
  const trying=S.tryOn?Object.values(S.tryOn).filter(id=>!Object.values(cl.wear).includes(id)):[];
  const cards=list.map(x=>{const owned=cl.owned.includes(x.id),wearing=cl.wear[x.slot]===x.id,tr=W[x.slot]===x.id&&!wearing;
    const btn=wearing?`<button class="buy on" data-off="${x.id}">Wearing ✓</button>`:owned?`<button class="buy own" data-wear="${x.id}">Wear</button>`
      :c>=x.price?`<button class="buy" data-buy="${x.id}">${COIN}${x.price}</button>`:`<button class="buy" disabled>${COIN}${x.price} · need ${x.price-c}</button>`;
    return `<div class="item${tr?" trying":""}">${x.drop===live&&live>0?'<span class="newtag">NEW</span>':""}<button class="thumb" data-try="${x.id}" aria-label="Try on ${esc(x.name)}">${figure(me,.2,CROP[x.slot],false,equip({},x.id))}</button>
      <b>${esc(x.name)}</b>${btn}</div>`}).join("");
  return `<div class="shophead"><button class="backbtn" id="shopback">‹ Back</button><h2>Shop</h2><span class="coinpill" style="height:40px">${COIN}${c}</span></div>
    <section class="stage"><div class="fig">${figure(me,.6,"0 0 160 260",false,W)}</div>
      <div style="min-width:0">${live>0?`<span class="newtag" style="position:static;display:inline-block;margin-bottom:6px">${DROPS[live].name} is live</span>`:""}<h3>${S.tryOn?"Trying it on":"Your look"}</h3><p>Tap any item to try it on. New drops land every 5 days. Earn coins: +10 per task, +25 for a perfect day, +50 per weekly goal.</p>
      ${S.tryOn?`<button class="buy own" id="resettry" style="padding:8px 14px">Back to my outfit</button>`:""}</div></section>
    <div class="cats" role="group" aria-label="Category">${CATS.map(([id,l])=>`<button data-cat="${id}" aria-pressed="${S.cat===id}">${l}</button>`).join("")}</div>
    ${nd?`<div class="dropbar"><b>${DROPS[live+1].name}</b><span>${nd-ti<=1?"drops tomorrow":`drops in ${nd-ti} days`} (day ${nd})</span></div>`:""}
    <div class="grid">${cards}${Array.from({length:teaseN},()=>`<div class="item locked"><div class="thumb">?</div><b>Coming day ${nd}</b><button class="buy" disabled>Locked</button></div>`).join("")}</div>
    <div class="status" id="status">${esc(S.statusMsg||"")}</div>`;
}
function wireShop(el){
  const me=S.me;
  $("shopback").onclick=()=>{S.page="home";S.tryOn=null;S.tryFor=null;render();window.scrollTo(0,0)};
  const r=$("resettry");if(r)r.onclick=()=>{S.tryOn=null;S.tryFor=null;render()};
  el.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>{S.cat=b.dataset.cat;render()});
  el.querySelectorAll("[data-try]").forEach(b=>b.onclick=()=>{S.tryOn=equip(S.tryOn||S.closet[me].wear,b.dataset.try);S.tryFor=me;render()});
  el.querySelectorAll("[data-buy]").forEach(b=>b.onclick=()=>{const x=ITEM[b.dataset.buy];if(coins(me)<x.price)return;
    const cl=S.closet[me];cl.owned=[...cl.owned,x.id];cl.wear=equip(cl.wear,x.id);S.tryOn=null;S.tryFor=null;toast(`Bought ${x.name}! −${x.price}`);saveCloset();render()});
  el.querySelectorAll("[data-wear]").forEach(b=>b.onclick=()=>{const cl=S.closet[me];cl.wear=equip(cl.wear,b.dataset.wear);S.tryOn=null;S.tryFor=null;saveCloset();render()});
  el.querySelectorAll("[data-off]").forEach(b=>b.onclick=()=>{const cl=S.closet[me],x=ITEM[b.dataset.off];const n={...cl.wear};delete n[x.slot];cl.wear=n;S.tryOn=null;S.tryFor=null;saveCloset();render()});
}
let closetQ=Promise.resolve();
function saveCloset(){const me=S.me;if(!S.db)return;const cl=S.closet[me];
  closetQ=closetQ.then(()=>S.db.doc("players/"+me).set({rules:S.rules[me],owned:cl.owned,wear:cl.wear})).catch(e=>setStatus(e?.code==="invalid_argument"?"You can view this tracker but not shop. Ask for Contributor access.":"Couldn't save your closet. Try again in a moment."))}

/* writes */
const queue={};
function setStatus(m){S.statusMsg=m;const s=$("status");if(s)s.textContent=m}
function setAmt(rid,dir){
  const k=S.me,i=S.sel;if(i>todayIdx())return;const r=S.rules[k].find(x=>x.id===rid);if(!r)return;
  const key=k+"_"+dateOf(i),cur={...(S.amt[key]||{})},v=Math.max(0,Math.round(((+cur[rid]||0)+dir*stepOf(r))*100)/100);cur[rid]=v;
  const before=points(k);S.amt[key]=cur;const gain=points(k)-before;
  if(gain>0)toast(gain>=50?`+${gain} · Weekly goal hit!`:`+${gain}`);
  render();writeLog(k,i);
}
function writeLog(k,i){if(!S.db)return;const key=k+"_"+dateOf(i);
  queue[key]=(queue[key]||Promise.resolve()).then(()=>S.db.doc("logs/"+key).set({player:k,date:dateOf(i),done:S.logs[key]||[],amt:S.amt[key]||{}}))
    .catch(e=>setStatus(e?.code==="invalid_argument"?"You can view this tracker but not check things off. Ask for Contributor access.":"Couldn't save that. Try again in a moment."))}
function toggle(rid){
  const k=S.me,i=S.sel;if(i>todayIdx())return;
  const key=k+"_"+dateOf(i),cur=S.logs[key]||[];
  const next=cur.includes(rid)?cur.filter(x=>x!==rid):[...cur,rid];
  const before=points(k);S.logs[key]=next;const gain=points(k)-before;
  if(gain>0)toast(gain>=60?`+${gain} · Weekly goal hit!`:gain>=35?`+${gain} · Perfect day!`:`+${gain}`);
  render();
  writeLog(k,i);
}

/* settings */
function openSettings(){
  S.draft={rules:S.rules[S.me].map(r=>({...r})),start:start()};drawSettings();$("sheet").hidden=false;
}
function drawSettings(){
  const me=S.me,sh=$("sheet");S.redraw=drawSettings;
  sh.innerHTML=`<div class="panel" role="dialog" aria-label="Settings"><div style="display:flex;align-items:center;gap:12px">${head(me)}<h2 style="font-size:24px;font-weight:800">Your rules</h2></div>
    ${editorHTML()}
    <button class="big dark" id="savebtn">Save</button>
    <div class="row2"><button id="switch">I'm actually ${PEOPLE[other(me)].name}</button><button id="intro">See intro again</button></div>
    <button class="big" id="close" style="background:none;border:1.5px solid var(--line);color:var(--ink)">Close</button></div>`;
  wireEditor(sh,()=>{});
  const close=()=>{sh.hidden=true;S.draft=null};
  $("savebtn").onclick=async()=>{sh._sync();sh.hidden=true;const p=saveDraft();S.draft=null;render();await p;render()};
  $("switch").onclick=()=>{close();S.me=other(me);ls.set("hard30-me",S.me);render()};
  $("intro").onclick=()=>{close();S.step=1;render()};
  $("close").onclick=close;
}

const refresh=()=>{if(!$("ob").hidden&&S.step===3)return;render()};
/* boot */
readHash();window.addEventListener("hashchange",readHash);
S.theme=ls.get("hard30-theme")==="dark"?"dark":"light";applyTheme();
S.me=KEYS.includes(ls.get("hard30-me"))?ls.get("hard30-me"):null;
{const v=ls.get("hard30-view");if(["D","W","M"].includes(v))S.view=v;const w=ls.get("hard30-who");if(["me","friend","both"].includes(w))S.who=w}
render();
(async()=>{
  const db=await window.claude?.use?.("db").catch(()=>null);
  if(!db){S.offline=true;S.statusMsg="Shared saving isn't available in this view, so changes stay on this screen only.";setSel();render();return}
  S.db=db;
  const timer=setTimeout(()=>{S.offline=true;setStatus("Still connecting. What you see may be out of date.");render()},10000);
  const fail=()=>{clearTimeout(timer);S.offline=true;setStatus("Lost connection to the shared tracker. Reload to reconnect.");render()};
  db.doc("config/main").onSnapshot(s=>{S.start=s.exists?s.data().start:null;S.loaded.c=true;setSel();applyPending();if(!s.metadata.fromCache)clearTimeout(timer);refresh()},fail);
  db.collection("players").onSnapshot(q=>{const r={sanju:[],anj:[]},cl={sanju:{owned:[],wear:{}},anj:{owned:[],wear:{}}};q.docs.forEach(d=>{const x=d.data()||{};if(!KEYS.includes(d.id))return;if(Array.isArray(x.rules))r[d.id]=x.rules;cl[d.id]={owned:Array.isArray(x.owned)?x.owned.filter(i=>ITEM[i]):[],wear:x.wear&&typeof x.wear==="object"?x.wear:{}}});S.rules=r;S.closet=cl;S.loaded.p=true;refresh()},fail);
  db.collection("steps").onSnapshot(q=>{const o={};q.docs.forEach(d=>{const x=d.data();if(x&&typeof x.steps==="number")o[d.id]=x.steps});S.steps=o;refresh()},()=>{});
  db.doc("weather/now").onSnapshot(s=>{S.weather=s.exists?s.data():null;refresh()},()=>{});
  db.collection("logs").onSnapshot(q=>{const o={},am={};q.docs.forEach(d=>{const x=d.data();if(x){o[d.id]=Array.isArray(x.done)?x.done:[];if(x.amt&&typeof x.amt==="object")am[d.id]=x.amt}});S.logs=o;S.amt=am;S.loaded.l=true;
    if(!q.metadata.fromCache&&(S.statusMsg||"").startsWith("Still"))setStatus("");refresh()},fail);
})();
</script>
